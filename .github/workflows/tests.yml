name: tests

# Checks that need no database, no Synthea run and no SEER record-level data: invariants of the committed results files,
# agreement of the README with them, and the Python helper tools. The dbt tests and the ETL need PostgreSQL and are NOT run here.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  r-results-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install testthat
        run: Rscript -e 'install.packages("testthat")'
      - name: Run results-invariant tests
        run: Rscript -e 'testthat::test_dir("tests/testthat", reporter = "summary", stop_on_failure = TRUE)'

  python-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - run: python -m pytest tests/python -q
