version: 2

models:
  - name: mart_nsclc_cohort
    description: >
      Main analysis cohort, one row per person: staged NSCLC, age >= 50 at diagnosis, all diagnosis years, follow-up
      censored at 120 months. Histology and stage come from SNOMED source codes, not standard concepts.
    columns:
      - name: person_id
        data_tests: [unique, not_null]
      - name: index_date
        data_tests: [not_null]
      - name: age_at_dx
        data_tests: [not_null]
      - name: sex
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['M', 'F']
      - name: stage
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['I', 'II', 'III', 'IV']
      - name: followup_months
        description: Months from index date to death or last recorded activity, capped at 120.
        data_tests: [not_null]
      - name: event
        description: 1 if the person died within 120 months of the index date, else 0.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: censored_at_120
        data_tests: [not_null]
      - name: dx_2010_2015
        description: Flag for the sensitivity cohort (diagnosed 2010-2015).
        data_tests: [not_null]
      - name: prior_other_cancer
        description: >
          True if, before the lung cancer index date, the person had an anticancer drug, a chemotherapy or radiation
          procedure, or a non-lung malignancy diagnosis. A flag only; nobody is excluded.
        data_tests: [not_null]
      - name: ttnt_months
        description: >
          Months from the start of line 1 to the start of line 2 or death, censored at the end of observation, capped at
          120. Null only for a person with no recorded line 1.
      - name: ttnt_event
        description: 1 if line 2 started or the person died before censoring (within the cap), else 0; null if there is no line 1.
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
  - name: mart_cohort_attrition
    description: Cohort flow table (people remaining after each rule).
